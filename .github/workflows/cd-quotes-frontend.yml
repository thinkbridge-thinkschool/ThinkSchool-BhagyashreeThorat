name: Deploy QuotesFrontend (Container Apps)

# CI/CD for the Angular frontend. On every push that touches the frontend, build
# the nginx image, push it to ACR, and roll the quotes-frontend Container App to
# the new image.
#
# AUTH MODEL — no stored secret:
#   Azure login uses OIDC / workload-identity federation (azure/login@v2 with
#   id-token: write). The three values below are IDENTIFIERS, not secrets:
#     vars.AZURE_CLIENT_ID        (app registration / user-assigned identity appId)
#     vars.AZURE_TENANT_ID
#     vars.AZURE_SUBSCRIPTION_ID
#   There is NO client secret and NO ACR password anywhere in this repo or in
#   GitHub secrets. ACR push uses the federated Azure session (az acr login),
#   and the Container App pulls the image with its own managed identity.
#
# One-time setup (run once by an Azure admin — documented in the PR/brief):
#   az ad app create --display-name gh-quotes-frontend
#   az ad app federated-credential create --id <appId> --parameters '{
#       "name":"gh-main","issuer":"https://token.actions.githubusercontent.com",
#       "subject":"repo:thinkbridge-thinkschool/ThinkSchool-BhagyashreeThorat:ref:refs/heads/day17-structurechanges",
#       "audiences":["api://AzureADTokenExchange"]}'
#   # grant the SP AcrPush on the registry + Contributor on the container app
#   then set repo variables AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID

on:
  push:
    branches: ["day17-structurechanges", "main"]
    paths:
      - "day-17/structurechanges/QuotesFrontend/**"
      - ".github/workflows/cd-quotes-frontend.yml"
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC federated login (no client secret)
  contents: read

env:
  ACR_NAME: bhagyathinkschool2026
  IMAGE_REPO: quotes-frontend
  RESOURCE_GROUP: thinkschool-rg
  CONTAINER_APP: quotes-frontend
  APP_DIR: day-17/structurechanges/QuotesFrontend

jobs:
  build-and-deploy:
    name: Build image & deploy to Container Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC — no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build & push image to ACR
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_REPO:${GITHUB_SHA::8}"
          docker build \
            -t "$IMAGE" \
            -t "$ACR_NAME.azurecr.io/$IMAGE_REPO:latest" \
            "$APP_DIR"
          docker push "$IMAGE"
          docker push "$ACR_NAME.azurecr.io/$IMAGE_REPO:latest"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy new image to Container App
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE"

      - name: Output live URL
        run: |
          FQDN=$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Deployed: https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
