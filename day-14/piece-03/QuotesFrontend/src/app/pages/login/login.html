<section class="login">
  <h1>Admin login</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input
        #emailInput
        id="email"
        type="email"
        formControlName="email"
        autocomplete="username"
        [attr.aria-invalid]="isInvalid('email')"
        [attr.aria-describedby]="describedBy('email')"
      />
      @if (isInvalid('email')) {
        <p id="email-error" class="field-error" role="alert">
          @if (form.controls.email.hasError('required')) {
            Email is required.
          } @else {
            Enter a valid email address.
          }
        </p>
      }
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input
        #passwordInput
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="isInvalid('password')"
        [attr.aria-describedby]="describedBy('password')"
      />
      @if (isInvalid('password')) {
        <p id="password-error" class="field-error" role="alert">
          Password is required.
        </p>
      }
    </div>

    <button type="submit" [disabled]="submitting()">
      @if (submitting()) {
        Signing in…
      } @else {
        Login
      }
    </button>

    @if (loginError(); as message) {
      <p class="status status--error" role="alert">{{ message }}</p>
    }
  </form>
</section>
